<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBP27444 的资源站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #1e2a3a; font-size: 2.5rem; margin-bottom: 10px; }
        p.sub { color: #555; margin-bottom: 30px; }
        .links a {
            display: inline-block;
            margin: 10px 20px;
            padding: 16px 32px;
            background: #1e2a3a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: background 0.2s;
        }
        .links a:hover { background: #2c3e5a; }

        /* 右上角更新日志按钮 */
        .changelog-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e2a3a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: background 0.2s;
        }
        .changelog-btn:hover { background: #2c3e5a; }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 侧滑面板 */
        .slide-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            max-width: 90vw;
            height: 100%;
            background: #fff;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            z-index: 1001;
            padding: 30px 25px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .slide-panel.open {
            transform: translateX(0);
        }
        .slide-panel h2 {
            color: #1e2a3a;
            font-weight: 400;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slide-panel .close-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }
        .slide-panel .close-btn:hover { color: #333; }
        .slide-panel ul {
            list-style: none;
            padding: 0;
        }
        .slide-panel li {
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }
        .slide-panel li .version {
            font-weight: 600;
            color: #1e2a3a;
            background: #eef2f7;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 13px;
        }
        .slide-panel li .date {
            color: #999;
            font-size: 13px;
            margin-left: 6px;
        }
        .slide-panel li .desc {
            display: block;
            margin-top: 2px;
        }
        .slide-panel code {
            background: #f0f2f5;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .slide-panel .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        @media (max-width: 480px) {
            .slide-panel { width: 100%; max-width: 100%; }
            .links a { display: block; margin: 12px 0; }
        }
    </style>
</head>
<body>

    <!-- 右上角按钮 -->
    <button class="changelog-btn" id="changelogToggle">📋 更新日志</button>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 侧滑面板 -->
    <div class="slide-panel" id="changelogPanel">
        <h2>
            <span>📋 更新日志</span>
            <button class="close-btn" id="closePanel">&times;</button>
        </h2>
        <ul>
            <li>
                <span class="version">v2.1.0</span>
                <span class="date">· 2026-08-14</span>
                <span class="desc">添加“物理小球”子站点；导航页新增入口</span>
            </li>
            <li>
                <span class="version">v2.0.0</span>
                <span class="date">· 2026-08-14</span>
                <span class="desc">笔记站迁移至 <code>/OI笔记站/</code> 子目录；根目录改为导航页</span>
            </li>
            <li>
                <span class="version">v1.1.0</span>
                <span class="date">· 2026-08-10</span>
                <span class="desc">OI 笔记站正式上线，含 20+ 篇算法笔记</span>
            </li>
            <li>
                <span class="version">v1.0.0</span>
                <span class="date">· 2026-07-25</span>
                <span class="desc">网站搭建完成（简易 OJ 页面），绑定域名</span>
            </li>
        </ul>
        <div class="footer-note">当前版本：v2.1.0</div>
    </div>

    <!-- 主内容 -->
    <h1>🚀 KBP 的资源站</h1>
    <p class="sub">欢迎访问我的个人资源导航中心</p>
    <div class="links">
        <a href="/OI笔记站/">📚 OI 笔记站</a>
        <a href="/物理小球/">🎱 物理小球</a>
        <!-- 以后可以在这里添加更多链接 -->
    </div>

    <script>
        const toggleBtn = document.getElementById('changelogToggle');
        const closeBtn = document.getElementById('closePanel');
        const panel = document.getElementById('changelogPanel');
        const overlay = document.getElementById('overlay');

        function openPanel() {
            panel.classList.add('open');
            overlay.classList.add('active');
        }
        function closePanelFn() {
            panel.classList.remove('open');
            overlay.classList.remove('active');
        }

        toggleBtn.addEventListener('click', openPanel);
        closeBtn.addEventListener('click', closePanelFn);
        overlay.addEventListener('click', closePanelFn);

        // ESC 键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePanelFn();
        });
    </script>
</body>
</html>
